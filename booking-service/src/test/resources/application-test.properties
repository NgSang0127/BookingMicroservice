# Server Port for Testing
server.port=0

# Use H2 In-Memory Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Eureka Discovery Client in tests
eureka.client.enabled=false
eureka.client.fetchRegistry=false
eureka.client.registerWithEureka=false

# Exclude RabbitMQ and Kafka auto-configurations in test environment
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Razorpay / Stripe dummy properties for tests
razorpay.api.key=dummy_key
razorpay.api.secret=dummy_secret
stripe.api.key=dummy_key

# Disable keycloak jwt issuer validation in tests or configure dummy
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:7080/realms/clinic-booking
